<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <style>
    .t { font-family: 'Segoe UI Rounded', 'Nunito', 'Varela Round', 'Segoe UI', Verdana, sans-serif; }
    .flota { animation: flota 2.8s ease-in-out infinite; }
    @keyframes flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .brilla { animation: brilla 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .b2 { animation-delay: 1s; }
    @keyframes brilla { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.6); } }
  </style>
  <defs>
    <pattern id="puntos" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.6" fill="#D6E6FF"/></pattern>
  </defs>
  <rect x="36" y="16" width="840" height="172" rx="26" fill="#4A2C40" opacity=".12"/>
  <rect x="30" y="10" width="840" height="172" rx="26" fill="#F3F8FF" stroke="#4A2C40" stroke-width="3"/>
  <rect x="30" y="10" width="840" height="172" rx="26" fill="url(#puntos)"/>

  <!-- Prácticas -->
  <rect x="64" y="34" width="590" height="50" rx="25" fill="#FFFFFF" stroke="#4A2C40" stroke-width="2.5"/>
  <circle cx="94" cy="59" r="15" fill="#8FD9B6" stroke="#4A2C40" stroke-width="2.2"/>
  <path d="M87 59 l5 5 l9 -10" fill="none" stroke="#4A2C40" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t" x="122" y="65" font-size="18" font-weight="800" fill="#4A2C40">Abierta a prácticas profesionales y servicio social</text>

  <!-- Intereses -->
  <text class="t" x="66" y="122" font-size="14" font-weight="800" fill="#7A5A6C">Me interesa:</text>
  <g class="t" font-size="14" font-weight="800" fill="#4A2C40">
    <g transform="translate(64 134)">
      <rect width="168" height="34" rx="17" fill="#FFE1EC" stroke="#4A2C40" stroke-width="2.2"/>
      <rect x="14" y="9" width="22" height="16" rx="3" fill="#FFFFFF" stroke="#4A2C40" stroke-width="2"/>
      <line x1="14" y1="14" x2="36" y2="14" stroke="#4A2C40" stroke-width="2"/>
      <text x="46" y="22">Desarrollo web</text>
    </g>
    <g transform="translate(244 134)">
      <rect width="196" height="34" rx="17" fill="#EDE3FF" stroke="#4A2C40" stroke-width="2.2"/>
      <path d="M25 7 Q25 17 35 17 Q25 17 25 27 Q25 17 15 17 Q25 17 25 7Z" fill="#FFFFFF" stroke="#4A2C40" stroke-width="2" stroke-linejoin="round"/>
      <text x="44" y="22">Inteligencia artificial</text>
    </g>
    <g transform="translate(452 134)">
      <rect width="148" height="34" rx="17" fill="#DDF5EA" stroke="#4A2C40" stroke-width="2.2"/>
      <rect x="12" y="10" width="28" height="15" rx="7.5" fill="#FFFFFF" stroke="#4A2C40" stroke-width="2"/>
      <path d="M19 14 v7 M15.5 17.5 h7" stroke="#4A2C40" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="33" cy="16" r="1.6" fill="#FF8FB1"/><circle cx="31" cy="20" r="1.6" fill="#8FD9B6"/>
      <text x="48" y="22">Videojuegos</text>
    </g>
  </g>

  <!-- Paleta de pintura con carita (pasatiempo) -->
  <g class="flota">
    <path d="M760 44 c-40 0 -66 26 -66 54 c0 28 22 42 46 42 c12 0 14 -12 8 -22 c-5 -9 1 -17 12 -17 h16 c22 0 36 -12 36 -28 c0 -18 -22 -29 -52 -29z" fill="#FFFFFF" stroke="#4A2C40" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="730" cy="80" r="9" fill="#FF8FB1" stroke="#4A2C40" stroke-width="2"/>
    <circle cx="760" cy="66" r="9" fill="#CDB8F5" stroke="#4A2C40" stroke-width="2"/>
    <circle cx="792" cy="70" r="9" fill="#8FD9B6" stroke="#4A2C40" stroke-width="2"/>
    <circle cx="724" cy="110" r="9" fill="#FFD66B" stroke="#4A2C40" stroke-width="2"/>
    <circle cx="812" cy="96" r="2.4" fill="#4A2C40"/><circle cx="828" cy="94" r="2.4" fill="#4A2C40"/>
    <path d="M817 101 q3 3 6 0" fill="none" stroke="#4A2C40" stroke-width="2" stroke-linecap="round"/>
    <path d="M846 40 l-48 62" stroke="#4A2C40" stroke-width="5" stroke-linecap="round"/>
    <path d="M800 99 l-6 9 l9 -5z" fill="#FF8FB1" stroke="#4A2C40" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <text class="t" x="770" y="168" font-size="12.5" font-weight="800" fill="#7A5A6C" text-anchor="middle">pinto con acrílico y acuarela</text>
  <path class="brilla" d="M680 40 Q680 48 688 48 Q680 48 680 56 Q680 48 672 48 Q680 48 680 40Z" fill="#FFD66B"/>
  <path class="brilla b2" d="M852 140 Q852 147 859 147 Q852 147 852 154 Q852 147 845 147 Q852 147 852 140Z" fill="#CDB8F5"/>
</svg>

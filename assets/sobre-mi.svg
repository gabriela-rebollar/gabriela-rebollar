<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230">
  <style>.t { font-family: 'Segoe UI Rounded', 'Nunito', 'Varela Round', 'Segoe UI', Verdana, sans-serif; }</style>
  <defs>
    <pattern id="puntos" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.6" fill="#F7CFDD"/>
    </pattern>
  </defs>
  <rect x="36" y="16" width="840" height="200" rx="26" fill="#4A2C40" opacity=".12"/>
  <rect x="30" y="10" width="840" height="200" rx="26" fill="#FFF7FA" stroke="#4A2C40" stroke-width="3"/>
  <rect x="30" y="10" width="840" height="200" rx="26" fill="url(#puntos)"/>

  <!-- 1. Proyectos de IA -->
  <g transform="translate(70 40)">
    <rect width="370" height="64" rx="20" fill="#FFFFFF" stroke="#4A2C40" stroke-width="2.5"/>
    <circle cx="36" cy="32" r="20" fill="#FFC2D6" stroke="#4A2C40" stroke-width="2.5"/>
    <path d="M30 26 l-7 6 l7 6 M42 26 l7 6 l-7 6" fill="none" stroke="#4A2C40" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t" x="68" y="28" font-size="16" font-weight="800" fill="#4A2C40">Proyectos de IA</text>
    <text class="t" x="68" y="48" font-size="13.5" font-weight="600" fill="#7A5A6C">Agentes inteligentes y sistemas web</text>
  </g>

  <!-- 2. Siempre aprendiendo -->
  <g transform="translate(460 40)">
    <rect width="370" height="64" rx="20" fill="#FFFFFF" stroke="#4A2C40" stroke-width="2.5"/>
    <circle cx="36" cy="32" r="20" fill="#DCCBFF" stroke="#4A2C40" stroke-width="2.5"/>
    <path d="M24 27 l12 -6 l12 6 l-12 6 z M29 30 v6 c4 4 10 4 14 0 v-6" fill="#FFFFFF" stroke="#4A2C40" stroke-width="2.2" stroke-linejoin="round"/>
    <text class="t" x="68" y="28" font-size="16" font-weight="800" fill="#4A2C40">Siempre aprendiendo</text>
    <text class="t" x="68" y="48" font-size="13.5" font-weight="600" fill="#7A5A6C">LLMs, LangGraph, Laravel y SQL</text>
  </g>

  <!-- 3. Bases de datos -->
  <g transform="translate(70 120)">
    <rect width="370" height="64" rx="20" fill="#FFFFFF" stroke="#4A2C40" stroke-width="2.5"/>
    <circle cx="36" cy="32" r="20" fill="#BFEBD7" stroke="#4A2C40" stroke-width="2.5"/>
    <ellipse cx="36" cy="24" rx="10" ry="4" fill="#FFFFFF" stroke="#4A2C40" stroke-width="2.2"/>
    <path d="M26 24 v16 c0 5 20 5 20 0 v-16 M26 32 c0 5 20 5 20 0" fill="none" stroke="#4A2C40" stroke-width="2.2"/>
    <text class="t" x="68" y="28" font-size="16" font-weight="800" fill="#4A2C40">Bases de datos</text>
    <text class="t" x="68" y="48" font-size="13.5" font-weight="600" fill="#7A5A6C">Normalización, integridad y permisos</text>
  </g>

  <!-- 4. Diseño con cariño -->
  <g transform="translate(460 120)">
    <rect width="370" height="64" rx="20" fill="#FFFFFF" stroke="#4A2C40" stroke-width="2.5"/>
    <circle cx="36" cy="32" r="20" fill="#FFE7A3" stroke="#4A2C40" stroke-width="2.5"/>
    <path d="M36 42 C26 35 25 27 30 25 C33 24 35 26 36 28 C37 26 39 24 42 25 C47 27 46 35 36 42Z" fill="#FF8FB1" stroke="#4A2C40" stroke-width="2.2" stroke-linejoin="round"/>
    <text class="t" x="68" y="28" font-size="16" font-weight="800" fill="#4A2C40">Diseño con cariño</text>
    <text class="t" x="68" y="48" font-size="13.5" font-weight="600" fill="#7A5A6C">Apps útiles, bonitas y fáciles de usar</text>
  </g>
</svg>

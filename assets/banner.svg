<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <style>
    .t { font-family: 'Segoe UI Rounded', 'Nunito', 'Varela Round', 'Segoe UI', Verdana, sans-serif; }
    .flota { animation: flota 3.2s ease-in-out infinite; }
    .flota2 { animation: flota 2.6s ease-in-out infinite; animation-delay: .6s; }
    @keyframes flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .brilla { animation: brilla 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .b2 { animation-delay: .7s; } .b3 { animation-delay: 1.3s; } .b4 { animation-delay: 1.8s; }
    @keyframes brilla { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.6); } }
  </style>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD3E2"/><stop offset="1" stop-color="#E6DAFF"/>
    </linearGradient>
    <pattern id="puntos" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.8" fill="#FFFFFF" opacity=".7"/>
    </pattern>
    <clipPath id="ventana"><rect x="30" y="30" width="840" height="240" rx="22"/></clipPath>
  </defs>

  <!-- Fondo con puntitos -->
  <rect width="900" height="300" rx="30" fill="url(#fondo)"/>
  <rect width="900" height="300" rx="30" fill="url(#puntos)"/>

  <!-- Ventana retro -->
  <rect x="36" y="38" width="840" height="240" rx="22" fill="#4A2C40" opacity=".12"/>
  <g clip-path="url(#ventana)">
    <rect x="30" y="30" width="840" height="240" fill="#FFFDFE"/>
    <rect x="30" y="30" width="840" height="40" fill="#FFC2D6"/>
  </g>
  <line x1="30" y1="70" x2="870" y2="70" stroke="#4A2C40" stroke-width="3"/>
  <rect x="30" y="30" width="840" height="240" rx="22" fill="none" stroke="#4A2C40" stroke-width="3"/>
  <circle cx="58" cy="50" r="7" fill="#FF8FB1" stroke="#4A2C40" stroke-width="2"/>
  <circle cx="80" cy="50" r="7" fill="#FFD66B" stroke="#4A2C40" stroke-width="2"/>
  <circle cx="102" cy="50" r="7" fill="#8FD9B6" stroke="#4A2C40" stroke-width="2"/>
  <rect x="130" y="40" width="260" height="21" rx="10.5" fill="#FFFFFF" stroke="#4A2C40" stroke-width="2"/>
  <text class="t" x="146" y="55" font-size="12" font-weight="700" fill="#9A7A8C">github.com/gabriela-rebollar</text>
  <path d="M836 44 c-4 -6 -12 -2 -8 4 l8 8 l8 -8 c4 -6 -4 -10 -8 -4z" fill="#FF8FB1" stroke="#4A2C40" stroke-width="2"/>

  <!-- Texto -->
  <text class="t" x="72" y="122" font-size="26" font-weight="800" fill="#E0649A">¡Hola! soy</text>
  <text class="t" x="70" y="172" font-size="46" font-weight="800" fill="#4A2C40">Gabriela Rebollar</text>
  <text class="t" x="72" y="206" font-size="18" font-weight="600" fill="#7A5A6C">Estudiante de IA y desarrollo web · México</text>

  <!-- Etiquetas -->
  <g class="t" font-size="13" font-weight="800" fill="#4A2C40" text-anchor="middle">
    <rect x="70" y="224" width="54" height="28" rx="14" fill="#FFE1EC" stroke="#4A2C40" stroke-width="2"/>
    <text x="97" y="243">IA</text>
    <rect x="132" y="224" width="96" height="28" rx="14" fill="#EDE3FF" stroke="#4A2C40" stroke-width="2"/>
    <text x="180" y="243">Agentes</text>
    <rect x="236" y="224" width="134" height="28" rx="14" fill="#DDF5EA" stroke="#4A2C40" stroke-width="2"/>
    <text x="303" y="243">Desarrollo web</text>
    <rect x="378" y="224" width="134" height="28" rx="14" fill="#FFF3C4" stroke="#4A2C40" stroke-width="2"/>
    <text x="445" y="243">Bases de datos</text>
  </g>

  <!-- Nube -->
  <g fill="#FFE9F1">
    <circle cx="640" cy="232" r="26"/><circle cx="680" cy="216" r="34"/><circle cx="728" cy="214" r="36"/>
    <circle cx="772" cy="230" r="28"/><rect x="630" y="226" width="150" height="34" rx="17"/>
  </g>

  <!-- Gatito con corazón -->
  <g class="flota">
    <path d="M652 128 L660 82 L690 112 Z" fill="#FFFFFF" stroke="#4A2C40" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M760 128 L752 82 L722 112 Z" fill="#FFFFFF" stroke="#4A2C40" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M662 116 L665 96 L679 110 Z" fill="#F9B4CC"/><path d="M750 116 L747 96 L733 110 Z" fill="#F9B4CC"/>
    <ellipse cx="706" cy="152" rx="66" ry="54" fill="#FFFFFF" stroke="#4A2C40" stroke-width="3.5"/>
    <ellipse cx="684" cy="148" rx="6.5" ry="8" fill="#4A2C40"/><ellipse cx="728" cy="148" rx="6.5" ry="8" fill="#4A2C40"/>
    <circle cx="687" cy="145" r="2.4" fill="#FFFFFF"/><circle cx="731" cy="145" r="2.4" fill="#FFFFFF"/>
    <ellipse cx="666" cy="166" rx="10" ry="6" fill="#F9B4CC"/><ellipse cx="746" cy="166" rx="10" ry="6" fill="#F9B4CC"/>
    <path d="M697 162 q4.5 6 9 0 q4.5 6 9 0" fill="none" stroke="#4A2C40" stroke-width="3" stroke-linecap="round"/>
    <path d="M706 238 C682 222 680 204 692 200 C699 198 704 202 706 207 C708 202 713 198 720 200 C732 204 730 222 706 238Z" fill="#FF8FB1" stroke="#4A2C40" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="684" cy="210" rx="10" ry="8" fill="#FFFFFF" stroke="#4A2C40" stroke-width="3"/>
    <ellipse cx="728" cy="210" rx="10" ry="8" fill="#FFFFFF" stroke="#4A2C40" stroke-width="3"/>
  </g>

  <!-- Corazoncitos flotando -->
  <g class="flota2">
    <path d="M806 118 c-3 -5 -10 -2 -7 3 l7 7 l7 -7 c3 -5 -4 -8 -7 -3z" fill="#FFB3CB" stroke="#4A2C40" stroke-width="1.8"/>
    <path d="M604 150 c-2.5 -4 -8 -1.5 -5.5 2.5 l5.5 5.5 l5.5 -5.5 c2.5 -4 -3 -6.5 -5.5 -2.5z" fill="#CDB8F5" stroke="#4A2C40" stroke-width="1.6"/>
  </g>

  <!-- Brillitos -->
  <path class="brilla" d="M600 92 Q600 104 612 104 Q600 104 600 116 Q600 104 588 104 Q600 104 600 92Z" fill="#CDB8F5"/>
  <path class="brilla b2" d="M820 160 Q820 170 830 170 Q820 170 820 180 Q820 170 810 170 Q820 170 820 160Z" fill="#FFD66B"/>
  <path class="brilla b3" d="M548 120 Q548 128 556 128 Q548 128 548 136 Q548 128 540 128 Q548 128 548 120Z" fill="#8FD9B6"/>
  <path class="brilla b4" d="M800 84 Q800 92 808 92 Q800 92 800 100 Q800 92 792 92 Q800 92 800 84Z" fill="#FF8FB1"/>
</svg>
